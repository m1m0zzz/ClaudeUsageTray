name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: src/ClaudeUsageTray.csproj
  RUNTIME_ID: win-x64
  DOTNET_VERSION: "9.0.x"

jobs:
  build:
    # WinForms のため Windows ランナーでビルドする（release.yml と同じ）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore "${{ env.PROJECT_PATH }}" -r ${{ env.RUNTIME_ID }}

      - run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --runtime ${{ env.RUNTIME_ID }} --no-restore
